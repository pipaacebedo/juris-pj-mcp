[project]
name = "juris-pj-mcp"
version = "0.2.5"
description = "MCP local para buscar en la Jurisprudencia Nacional Sistematizada del Poder Judicial del Peru (jurisprudencia.pj.gob.pe). No oficial."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.27",
]

[project.scripts]
juris-pj-mcp = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = true
